<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart – ShopEasy</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <nav class="nav-inner">
    <a href="index.html" class="logo">ShopEasy</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="cart.html" class="active">Cart</a>
      <a href="checkout.html">Checkout</a>
    </div>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search products…">
      <button id="search-btn" onclick="window.location.href='index.html?q='+document.getElementById('search-input').value">🔍</button>
    </div>
    <a href="cart.html" class="cart-icon">
      🛒
      <span class="cart-badge" id="cart-badge" style="display:none">0</span>
    </a>
  </nav>
</header>

<div class="cart-layout">

  <!-- Cart items (left column) -->
  <div>
    <h2 class="section-title" style="margin-bottom:1.5rem">Shopping Cart</h2>
    <div id="cart-items-container"></div>
  </div>

  <!-- Order summary (right column) -->
  <div id="cart-summary" class="cart-summary">
    <h3>Order Summary</h3>

    <div class="summary-row">
      <span>Subtotal</span>
      <span class="subtotal-val">$0.00</span>
    </div>
    <div class="summary-row">
      <span>Discount</span>
      <span class="discount-val">$0.00</span>
    </div>
    <div class="summary-row">
      <span>Shipping</span>
      <span class="shipping-val">$5.99</span>
    </div>
    <div class="summary-row">
      <span>Tax (8%)</span>
      <span class="tax-val">$0.00</span>
    </div>
    <div class="summary-row total">
      <span>Total</span>
      <span class="total-val">$0.00</span>
    </div>

    <!-- Coupon -->
    <div class="coupon-row">
      <input type="text" id="coupon-input" class="coupon-input" placeholder="Coupon code">
      <button id="apply-coupon-btn" class="btn-coupon">Apply</button>
    </div>
    <p style="font-size:0.78rem;color:#888">Try: SAVE10, SAVE20, or HALFOFF (case-sensitive)</p>

    <a href="checkout.html" class="btn-primary" style="width:100%;text-align:center;margin-top:1.2rem;display:block">
      Proceed to Checkout
    </a>
    <a href="index.html" style="display:block;text-align:center;margin-top:0.8rem;font-size:0.9rem;color:#888">
      ← Continue Shopping
    </a>
  </div>

</div>

<div id="toast"></div>

<footer>
  <p>&copy; 2024 ShopEasy. All rights reserved. | <a href="#">Privacy Policy</a> | <a href="#">Terms</a></p>
</footer>

<script src="app.js"></script>
</body>
</html>
